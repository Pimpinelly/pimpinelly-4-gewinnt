<!DOCTYPE html>
<html lang="de">
<head>

    <title>Pimpinelly 4-Gewinnt</title>
    <style>
        body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 10px; text-align: center; }
        .logo { width: 60px; height: auto; margin-top: 5px; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.4rem; }
        .sub { font-size: 1.1rem; color: #333; margin-bottom: 15px; font-weight: bold; display: block; }

        .wrapper {
            background-color: #222; padding: 10px; border-radius: 12px;
            border: 4px solid #444; display: inline-block;
        }

        .board { 
            background-color: #0044cc; border-collapse: separate; 
            border-spacing: 5px; border-radius: 8px;
        }

        .cell { 
            width: 38px; height: 38px; background-color: #ffffff; 
            border-radius: 50%; cursor: pointer; display: block;
        }

        .p1 { background-color: #ff9800 !important; }
        .p2 { background-color: #ffeb3b !important; }

        #status { font-weight: bold; margin: 15px 0; font-size: 1.1rem; min-height: 1.5em; }
        .reset-btn { background: #ff9800; color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; }
        .confetti { position: fixed; width: 8px; height: 8px; top: -10px; z-index: 999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
