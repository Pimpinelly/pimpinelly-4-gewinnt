<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys Jahrmarkt-4-Gewinnt</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background-color: #fce4ec; 
            color: #333; 
            margin: 0; 
            padding: 10px; 
            touch-action: manipulation; 
        }

        img { width: 100px; height: auto; margin: 5px auto; display: block; border-radius: 10px; }
        
        /* Die Jahrmarkt-Lämpchen */
        .lights-container {
            display: inline-block;
            padding: 15px;
            background: #222; /* Dunkler Rahmen für die Lichter */
            border-radius: 20px;
            border: 8px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            animation: borderGlow 2s infinite alternate;
        }

        @keyframes borderGlow {
            from { box-shadow: 0 0 10px #ff4081; }
            to { box-shadow: 0 0 25px #ffeb3b; }
        }

        /* Einzelne blinkende Lämpchen */
        .light {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
        }

        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-gap: 5px; 
            background-color: #007bff; 
            padding: 10px; 
            border-radius: 10px; 
            width: 85vw; 
            max-width: 340px; 
            position: relative;
            overflow: hidden; /* Damit Steine "hinter" dem Rahmen verschwinden */
        }

        .cell { 
            aspect-ratio: 1 / 1; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 1px solid #0056b3;
            position: relative;
            z-index: 2;
        }

        /* Die Animation für fallende Steine */
        .stone {
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            top: 5%;
            left: 5%;
            z-index: 1;
            animation: fall 0.5s cubic-bezier(0.6, 0, 0.4, 1.2);
        }

        @keyframes fall {
            0% { transform: translateY(-500px); }
            100% { transform: translateY(0); }
        }

        .player-stone { background: orange; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }
        .computer-stone { background: blue; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }

        /* Blinkeffekt bei Sieg */
        .win-blink { animation: blink 0.3s infinite; }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        #status { font-size: 1.2rem; margin: 10px 0; font-weight: bold; }
        
        button { 
            padding: 12px 24px; 
            font-size: 1rem; 
            background-color: #ff4081; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            margin: 10px 0;
        }
    </style>
</head>
<body>
<body>

    <img src="logo.png" alt="Logo">
    
    <h1 style="color: #ff4081; text-shadow: 2px 2px #fff;">Pimpinellys 4-Gewinnt</h1>
    
    <div id="score-display">Pimpinelly: 0 | Computer: 0
    </div>
    
    <h2 id="status">Bereit zum Zocken?</h2>
    <button onclick="resetGame()">Neues Spiel</button>

    <script>
const ROWS = 6;
        const COLUMNS = 7;
        let board = [];
        let gameActive = true;
        let scores = { player: 0, computer: 0 };

        // Der künstliche Klick-Sound (optimiert auf einen kurzen, sauberen Ton)
        function playClick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) { console.log("Audio-Fehler"); }
        }

        function initGame() {
            board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
            gameActive = true;
            document.getElementById('status').innerText = "Du bist dran!";
            document.getElementById('board').classList.remove('win-blink');
            createBoard();
            createLights();
        }

        function createLights() {
            const frame = document.getElementById('outer-frame');
            document.querySelectorAll('.light').forEach(l => l.remove());
            const colors = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0'];
            for(let i=0; i<20; i++) {
                const l = document.createElement('div');
                l.className = 'light';
                l.style.top = (i < 10) ? '-10px' : '100%';
                l.style.left = (i % 10) * 11 + '%';
                l.style.background = colors[i % colors.length];
                l.style.boxShadow = `0 0 8px ${l.style.background}`;
                l.style.animation = `blink ${0.5 + Math.random()}s infinite`;
                frame.appendChild(l);
            }
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                gameActive = false; // Verhindert Mehrfach-Klicks während der Stein fällt
                placeStone(r, c, 1);
                if (checkWin(r, c)) {
                    scores.player++;
                    setTimeout(() => {
                        try { new Audio('tusch.mp3').play(); } catch(e) {}
                        endGame("Sieg für Pimpinelly! 🤡🎺");
                    }, 500); // Tusch erst, wenn der Stein unten angekommen ist
                } else {
                    setTimeout(makeMove, 700);
                }
            }
        }

        function placeStone(r, c, p) {
            board[r][c] = p;
            const cell = document.getElementById(`cell-${r}-${c}`);
            const stone = document.createElement('div');
            stone.className = `stone ${p === 1 ? 'player-stone' : 'computer-stone'}`;
            cell.appendChild(stone);
            playClick(); // Sound wird hier GENAU EINMAL beim Erstellen des Steins gerufen
        }

        function makeMove() {
            let bestScore = -Infinity;
            let move = 3;
            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r !== -1) {
                    let score = evaluatePosition(r, c);
                    if (score > bestScore) { bestScore = score; move = c; }
                }
            }
            let r = getLowestEmptyRow(move);
            placeStone(r, move, 2);
            if (checkWin(r, move)) {
                scores.computer++;
                setTimeout(() => {
                    endGame("Computer gewinnt! 🤖");
                }, 500);
            } else {
                gameActive = true;
                document.getElementById('status').innerText = "Du bist dran!";
            }
        }

        function evaluatePosition(r, c) {
            board[r][c] = 2; if (checkWin(r, c)) { board[r][c] = 0; return 1000; }
            board[r][c] = 1; if (checkWin(r, c)) { board[r][c] = 0; return 500; }
            board[r][c] = 0; return (3 - Math.abs(3 - c));
        }

        function endGame(text) {
            document.getElementById('status').innerText = text;
            document.getElementById('score-display').innerText = `Pimpinelly: ${scores.player} | Computer: ${scores.computer}`;
            document.getElementById('board').classList.add('win-blink');
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) if (board[r][c] === 0) return r;
            return -1;
        }

        function checkWin(r, c) {
            const p = board[r][c];
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++; else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++; else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() { initGame(); }
        initGame();
    </script>
</body>
</html>
