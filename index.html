<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #ffffff; 
            text-align: center; 
            margin: 0; padding: 10px;
        }
        
        .logo { width: 80px; height: auto; margin: 10px auto; display: block; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.8rem; }
        .sub { font-style: italic; color: #666; margin-bottom: 15px; display: block; }

        /* Der leuchtende Zirkus-Rahmen */
        .outer-frame {
            display: inline-block;
            padding: 15px;
            background-color: #222;
            border-radius: 20px;
            box-shadow: 0 0 20px red;
            animation: blinkFrame 1.5s infinite alternate;
        }

        @keyframes blinkFrame {
            from { box-shadow: 0 0 15px red; }
            to { box-shadow: 0 0 25px yellow; }
        }

        /* Das Spielfeld - Jetzt mit festen Tabellen-Werten für maximale Stabilität */
        .board-table {
            background-color: #0044cc;
            border-collapse: separate;
            border-spacing: 8px;
            padding: 10px;
            border-radius: 10px;
            margin: 0 auto;
        }

        .slot {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            cursor: pointer;
            display: block; /* Erzwingt Sichtbarkeit */
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* Die Spielsteine mit !important, damit sie die weiße Farbe überschreiben */
        .p1 { background-color: #ff9800 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.4) !important; }
        .p2 { background-color: #ffeb3b !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.4) !important; }

        #status { margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 1.5em; }
        
        button {
            margin-top: 20px; padding: 12px 30px; font-size: 1.1rem;
            background-color: #ff9800; color: #000; border: none; 
            border-radius: 50px; cursor: pointer; font-weight: bold;
        }

        @media (max-width: 400px) {
            .slot { width: 32px; height: 32px; }
            .board-table { border-spacing: 5px; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <span class="sub">Du spielst heute gegen Pimpinelly</span>

    <div class="outer-frame">
        <table class="board-table" id="gameTable">
            </table>
    </div>

    <div id="status">Du bist dran!</div>
    <button onclick="resetGame()">Neues Spiel</button>

    <audio id="winSound" src="tusch.mp3" preload="auto"></audio>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        let canPlay = true;

        function createBoard() {
            const table = document.getElementById('gameTable');
            table.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    const div = document.createElement('div');
                    div.className = 'slot';
                    div.id = `s-${r}-${c}`;
                    div.onclick = () => handleMove(c);
                    td.appendChild(div);
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
        }

        function updateDisplay() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const el = document.getElementById(`s-${r}-${c}`);
                    el.className = 'slot';
                    if (board[r][c] === 1) el.classList.add('p1');
                    if (board[r][c] === 2) el.classList.add('p2');
                }
            }
        }

        function handleMove(c) {
            if (!canPlay) return;
            let r = -1;
            for (let i = ROWS - 1; i >= 0; i--) {
                if (board[i][c] === 0) { r = i; break; }
            }
            if (r === -1) return;

            board[r][c] = 1;
            updateDisplay();

            if (checkWin(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! Du hast gewonnen! 🎉";
                document.getElementById('winSound').play().catch(() => {});
                canPlay = false;
            } else {
                canPlay = false;
                document.getElementById('status').innerText = "Pimpinelly denkt nach...";
                setTimeout(aiMove, 600);
            }
        }

        function aiMove() {
            let moves = [];
            for (let c = 0; c < COLS; c++) {
                if (board[0][c] === 0) moves.push(c);
            }

            let bestC = moves[Math.floor(Math.random() * moves.length)];
            
            // Logik: Blockieren oder Gewinnen
            for (let c of moves) {
                let r = -1;
                for (let i = ROWS - 1; i >= 0; i--) { if (board[i][c] === 0) { r = i; break; } }
                
                board[r][c] = 2;
                if (checkWin(r, c, 2)) { updateDisplay(); finishGame("Pimpinelly gewinnt! 🤡"); return; }
                board[r][c] = 0;

                board[r][c] = 1;
                if (checkWin(r, c, 1)) { board[r][c] = 2; updateDisplay(); canPlay = true; document.getElementById('status').innerText = "Du bist dran!"; return; }
                board[r][c] = 0;
            }

            let rFinal = -1;
            for (let i = ROWS - 1; i >= 0; i--) { if (board[i][bestC] === 0) { rFinal = i; break; } }
            board[rFinal][bestC] = 2;
            updateDisplay();
            
            if (checkWin(rFinal, bestC, 2)) {
                finishGame("Pimpinelly gewinnt! 🤡");
            } else {
                canPlay = true;
                document.getElementById('status').innerText = "Du bist dran!";
            }
        }

        function finishGame(msg) {
            document.getElementById('status').innerText = msg;
            canPlay = false;
        }

        function checkWin(r, c, p) {
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for (let [dr, dc] of dirs) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) count++; else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) count++; else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            canPlay = true;
            document.getElementById('status').innerText = "Du bist dran!";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
