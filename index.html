<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinelly 4 Gewinnt</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; padding-top: 20px; }
        .board { display: grid; grid-template-columns: repeat(7, 50px); grid-gap: 5px; justify-content: center; background-color: #333; padding: 10px; border-radius: 10px; margin: 20px auto; width: fit-content; }
        .cell { width: 50px; height: 50px; background-color: white; border-radius: 50%; cursor: pointer; }
        /* Spieler ist Orange, Pimpinelly ist Blau */
        .cell.player { background-color: orange; }
        .cell.pimpinelly { background-color: blue; }
        img { width: 150px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #333; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly Logo" onerror="this.style.display='none'">
    <h1>4 Gewinnt gegen Pimpinelly</h1>
    
    <div class="board" id="board"></div>
    
    <h2 id="status">Du bist dran!</h2>
    <button onclick="resetGame()">Neu starten</button>

    <script>
        const ROWS = 6;
        const COLUMNS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
        let gameActive = true;

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1); // Spieler setzt Stein
                if (checkWin(r, c)) {
                    document.getElementById('status').innerText = "Gratulation! Du hast gewonnen! 🎉";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Pimpinelly überlegt...";
                    setTimeout(pimpinellyMove, 600);
                }
            }
        }

        function pimpinellyMove() {
            if (!gameActive) return;
            let move = calculateBestMove();
            let r = getLowestEmptyRow(move);
            
            if (r !== -1) {
                placeStone(r, move, 2); // Pimpinelly setzt Stein
                if (checkWin(r, move)) {
                    document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
                    new Audio('tusch.mp3').play().catch(() => console.log("Audio-Play blockiert oder Datei fehlt."));
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Du bist dran!";
                }
            }
        }

        function calculateBestMove() {
            let bestScore = -Infinity;
            let move = -1;

            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r !== -1) {
                    let score = 0;
                    board[r][c] = 2; // Pimpinelly Sieg prüfen
                    if (checkWin(r, c)) score = 1000;
                    else {
                        board[r][c] = 1; // Spieler blocken prüfen
                        if (checkWin(r, c)) score = 100;
                        else if (c === 3) score = 3; // Mitte ist taktisch besser
                    }
                    board[r][c] = 0;

                    if (score > bestScore) {
                        bestScore = score;
                        move = c;
                    }
                }
            }
            if (move === -1) {
                let available = [];
                for(let c=0; c<COLUMNS; c++) if(board[0][c] === 0) available.push(c);
                move = available[Math.floor(Math.random()*available.length)];
            }
            return move;
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === 0) return r;
            }
            return -1;
        }

        function placeStone(r, c, p) {
            board[r][c] = p;
            const cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
            cell.classList.add(p === 1 ? 'player' : 'pimpinelly');
        }

        function checkWin(r, c) {
            const p = board[r][c];
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() {
            board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
            gameActive = true;
            document.getElementById('status').innerText = "Du bist dran!";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
