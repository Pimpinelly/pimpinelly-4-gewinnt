<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys Profi-4-Gewinnt</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: #eee; 
            margin: 0; padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        .info { font-style: italic; margin-bottom: 15px; display: block; }

        /* Sicherer Container gegen "Balken-Effekt" */
        .board-container {
            display: inline-block;
            background-color: #222;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 0 20px red;
            animation: glow 1.5s infinite alternate;
        }

        /* Das Raster: Fest definierte Spalten und Reihen */
        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 45px); 
            grid-template-rows: repeat(6, 45px); 
            grid-gap: 8px; 
            background-color: #0055ff; 
            padding: 12px; 
            border-radius: 8px;
            border: 4px solid #0033aa;
        }

        /* Die weißen Löcher */
        .cell { 
            width: 45px;
            height: 45px;
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Die Farben der Steine */
        .cell.player { background-color: orange !important; }
        .cell.pimpinelly { background-color: yellow !important; }
        
        #status { margin-top: 15px; font-size: 1.5rem; font-weight: bold; }
        
        button {
            margin-top: 20px; padding: 10px 25px; 
            font-size: 1rem; cursor: pointer;
            background: #333; color: white; border: none; border-radius: 5px;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px red; }
            to { box-shadow: 0 0 25px yellow; }
        }

        /* Handy-Optimierung */
        @media (max-width: 400px) {
            .board { 
                grid-template-columns: repeat(7, 38px); 
                grid-template-rows: repeat(6, 38px);
                grid-gap: 5px;
            }
            .cell { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <h1>Pimpinellys 4-Gewinnt</h1>
    <span class="info">Du spielst heute gegen Pimpinelly</span>
    
    <div class="board-container">
        <div id="board" class="board"></div>
    </div>
    
    <div id="status">Du bist dran!</div>
    <button onclick="resetGame()">Neustart</button>

    <script>
        const ROWS = 6, COLS = 7;
        let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        let active = true;

        function init() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `c-${r}-${c}`;
                    cell.onclick = () => play(c);
                    b.appendChild(cell);
                }
            }
        }

        function play(c) {
            if(!active) return;
            let r = getRow(c);
            if(r < 0) return;
            
            doMove(r, c, 1);
            if(check(r, c, 1)) {
                finish("Du hast gewonnen! 🎉");
            } else {
                document.getElementById('status').innerText = "Pimpinelly überlegt...";
                active = false;
                setTimeout(ai, 500);
            }
        }

        function ai() {
            let move = bestMove();
            let r = getRow(move);
            doMove(r, move, 2);
            if(check(r, move, 2)) {
                finish("Pimpinelly gewinnt! 🤡");
            } else {
                active = true;
                document.getElementById('status').innerText = "Du bist dran!";
            }
        }

        function bestMove() {
            // 1. Kann ich gewinnen?
            for(let c=0; c<COLS; c++) {
                let r = getRow(c);
                if(r>=0) {
                    board[r][c]=2;
                    if(check(r,c,2)) { board[r][c]=0; return c; }
                    board[r][c]=0;
                }
            }
            // 2. Muss ich den Spieler blocken? (Extrem wichtig für Boden-Strategie)
            for(let c=0; c<COLS; c++) {
                let r = getRow(c);
                if(r>=0) {
                    board[r][c]=1;
                    if(check(r,c,1)) { board[r][c]=0; return c; }
                    board[r][c]=0;
                }
            }
            // 3. Mitte bevorzugen & Vorlagen verhindern
            let moves = [3, 2, 4, 1, 5, 0, 6].filter(c => getRow(c) >= 0);
            for(let c of moves) {
                let r = getRow(c);
                if(r > 0) {
                    board[r][c] = 2; board[r-1][c] = 1;
                    let danger = check(r-1, c, 1);
                    board[r][c] = 0; board[r-1][c] = 0;
                    if(!danger) return c;
                }
            }
            return moves[0];
        }

        function getRow(c) {
            for(let r=ROWS-1; r>=0; r--) if(board[r][c]===0) return r;
            return -1;
        }

        function doMove(r, c, p) {
            board[r][c] = p;
            document.getElementById(`c-${r}-${c}`).className = `cell ${p===1?'player':'pimpinelly'}`;
        }

        function check(r, c, p) {
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(let [dr, dc] of dirs) {
                let count = 1;
                for(let i=1; i<4; i++) {
                    let nr=r+dr*i, nc=c+dc*i;
                    if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS && board[nr][nc]===p) count++; else break;
                }
                for(let i=1; i<4; i++) {
                    let nr=r-dr*i, nc=c-dc*i;
                    if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS && board[nr][nc]===p) count++; else break;
                }
                if(count>=4) return true;
            }
            return false;
        }

        function finish(msg) {
            document.getElementById('status').innerText = msg;
            active = false;
        }

        function resetGame() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            active = true;
            document.getElementById('status').innerText = "Du bist dran!";
            init();
        }

        init();
    </script>
</body>
</html>
