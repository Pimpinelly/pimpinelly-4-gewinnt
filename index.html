<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background-color: #f0f0f0; 
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #333; }

        /* Blinkende Lichterkette */
        .board-container {
            display: inline-block;
            padding: 12px;
            background-color: #222; 
            border-radius: 20px;
            margin: 10px auto;
            position: relative;
            animation: circusLights 0.8s linear infinite;
            max-width: 95vw;
        }

        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-gap: 5px; 
            background-color: #0055ff; /* Spielfeld Blau */
            padding: 10px; 
            border-radius: 10px; 
            width: 350px; 
            max-width: 85vw; 
            border: 4px solid #0033aa;
        }
        
        .cell { 
            aspect-ratio: 1 / 1; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        .cell.player { background-color: orange; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .cell.pimpinelly { background-color: yellow; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        
        .logo { width: 140px; max-width: 40%; margin-top: 10px; }
        
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        @keyframes circusLights {
            0%, 100% { box-shadow: 0 0 12px 4px red, 0 0 20px 6px yellow; }
            50% { box-shadow: 0 0 12px 4px yellow, 0 0 20px 6px red; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly Logo" class="logo" onerror="this.style.display='none'">
    <h1>Pimpinellys 4-Gewinnt</h1>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <h2 id="status">Spieler ist dran!</h2>
    <button onclick="resetGame()">Neu starten</button>

    <script>
        const ROWS = 6;
        const COLUMNS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
        let gameActive = true;

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1);
                if (checkWin(r, c, 1)) {
                    document.getElementById('status').innerText = "Gratulation! Spieler hat gewonnen! 🎉";
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Pimpinelly überlegt...";
                    setTimeout(pimpinellyMove, 600);
                }
            }
        }

        function pimpinellyMove() {
            if (!gameActive) return;
            let move = calculateBestMove();
            let r = getLowestEmptyRow(move);
            if (r !== -1) {
                placeStone(r, move, 2);
                if (checkWin(r, move, 2)) {
                    document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
                    new Audio('tusch.mp3').play().catch(() => {});
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Spieler ist dran!";
                }
            }
        }

        function calculateBestMove() {
            let movesWithScores = [];
            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r === -1) continue;

                // 1. Pimpinelly Sieg-Chance nutzen
                board[r][c] = 2;
                if (checkWin(r, c, 2)) { board[r][c] = 0; return c; }
                board[r][c] = 0;

                // 2. Spieler blocken (verhindert 4er am Boden oder Reihen)
                board[r][c] = 1;
                if (checkWin(r, c, 1)) { board[r][c] = 0; return c; }
                board[r][c] = 0;

                // 3. Strategische Bewertung
                let score = (c === 3) ? 15 : (c === 2 || c === 4) ? 8 : 0;
                score += countLines(r, c, 2) * 4; // Eigener Aufbau
                score += countLines(r, c, 1) * 3; // Spieler stören

                // Anti-Vorlage-Logik
                if (r > 0) {
                    board[r][c] = 2;
                    if (checkWin(r-1, c, 1)) score -= 100;
                    board[r][c] = 0;
                }
                movesWithScores.push({col: c, score: score});
            }
            movesWithScores.sort((a, b) => b.score - a.score);
            return movesWithScores[0].col;
        }

        function countLines(r, c, p) {
            let score = 0;
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 0;
                for (let i = -3; i <= 3; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && (board[nr][nc] === p || board[nr][nc] === 0)) {
                        count++;
                    } else count = 0;
                    if (count >= 4) score++;
                }
            }
            return score;
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === 0) return r;
            }
            return -1;
        }

        function isDraw() {
            return board[0].every(cell => cell !== 0);
        }
