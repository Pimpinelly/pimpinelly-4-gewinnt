<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; text-align: center; padding: 10px; margin: 0; overflow: hidden; }
        .logo-img { width: 80px; height: auto; display: block; margin: 5px auto; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.8rem; }
        
        /* Absolut fester Container für das Spiel */
        .wrapper {
            display: inline-block;
            background: #222;
            padding: 12px;
            border-radius: 15px;
            border: 5px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 5;
        }

        /* Spielfeld mit festen Maßen (7 Spalten x 48px = ca. 340px) */
        .board { 
            background-color: #0044cc; 
            padding: 8px; 
            border-radius: 8px; 
            display: table; 
            margin: 0 auto;
            border-spacing: 6px;
        }

        .row { display: table-row; }
        
        /* Zellen mit fixierter Größe - Darf nicht gestaucht werden! */
        .cell {
            display: table-cell;
            width: 42px !important;
            height: 42px !important;
            min-width: 42px;
            min-height: 42px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        .p1 { background: #ff9800 !important; } /* Spieler Orange */
        .p2 { background: #ffeb3b !important; } /* Pimpinelly Gelb */

        #status { font-weight: bold; margin: 10px 0; font-size: 1.2rem; min-height: 1.5em; color: #333; }
        
        .reset-btn {
            background: #ff9800;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        /* Konfetti: Absolut positioniert, stört das Layout nicht */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -10px;
            z-index: 100;
            pointer-events: none; /* Man kann durch das Konfetti klicken */
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly" class="logo-img">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <p style="margin:0 0 10px 0;">Du spielst heute gegen Pimpinelly</p>

    <div class="wrapper" id="main-wrapper">
        <div id="game-board" class="board"></div>
    </div>

    <div id="status">Lade Manege...</div>
    <button class="reset-btn" onclick="startNewGame()">Neues Spiel</button>

    <audio id="fanfare" src="tusch.mp3" preload="auto"></audio>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let grid = [];
        let canMove = true;

        function startNewGame() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            canMove = true;
            document.getElementById('status').innerText = "Du bist dran!";
            // Altes Konfetti entfernen
            const old = document.querySelectorAll('.confetti');
            old.forEach(c => c.remove());
            render();
        }

        function render() {
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                for (let c = 0; c < COLS; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    if (grid[r][c] === 1) cellDiv.classList.add('p1');
                    if (grid[r][c] === 2) cellDiv.classList.add('p2');
                    cellDiv.onclick = () => makeMove(c);
                    rowDiv.appendChild(cellDiv);
                }
                boardEl.appendChild(rowDiv);
            }
        }

        function makeMove(c) {
            if (!canMove) return;
            let r = -1;
            for (let i = ROWS - 1; i >= 0; i--) {
                if (grid[i][c] === 0) { r = i; break; }
            }
            if (r === -1) return;

            grid[r][c] = 1;
            render();

            if (check(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! 🎉";
                document.getElementById('fanfare').play().catch(() => {});
                launchConfetti();
                canMove = false;
            } else {
                canMove = false;
                document.getElementById('status').innerText = "Pimpinelly zieht...";
                setTimeout(ai, 500);
            }
        }

        function launchConfetti() {
            const colors = ['#ff9800', '#ffeb3b', '#ff0000', '#00ff00', '#0044cc', '#ff00ff'];
            for (let i = 0; i < 80; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 3 + 2) + 's';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                document.body.appendChild(conf);
            }
        }

        function ai() {
            let move = -1;
            // Pimpinelly Strategie (Sieg/Block/Zentrum)
            for(let c=0; c<COLS; c++) {
                let r = getR(c);
                if(r != -1) { grid[r][c]=2; if(check(r,c,2)) move=c; grid[r][c]=0; }
            }
            if(move == -1) {
                for(let c=0; c<COLS; c++) {
                    let r = getR(c);
                    if(r != -1) { grid[r][c]=1; if(check(r,c,1)) move=c; grid[r][c]=0; }
                }
            }
            if(move == -1) move = 3;
            if(getR(move) == -1) {
                for(let i=0; i<COLS; i++) if(getR(i)!=-1) move=i;
            }

            let finalR = getR(move);
            grid[finalR][move] = 2;
            render();

            if (check(finalR, move, 2)) {
                document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
            } else {
                canMove = true;
                document.getElementById('status').innerText = "Du bist dran!";
            }
        }

        function getR(c) {
            for(let i=ROWS-1; i>=0; i--) if(grid[i][c]===0) return i;
            return -1;
        }

        function check(r, c, p) {
            const directions = [[0,1],[1,0],[1,1],[1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) count++; else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) count++; else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        startNewGame();
    </script>
</body>
</html>
