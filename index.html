<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        /* Grunddesign */
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f0f0f0; 
            margin: 0; padding: 10px;
            touch-action: manipulation;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #333; }
        .info { font-style: italic; color: #555; margin-bottom: 10px; }

        /* Die blinkende Zirkus-Lichterkette */
        .board-container {
            display: inline-block;
            padding: 12px;
            background-color: #222; 
            border-radius: 20px;
            margin: 5px auto;
            position: relative;
            animation: circusLights 0.8s linear infinite;
        }

        /* Das blaue Spielfeld - WICHTIG: Grid muss 7 Spalten haben */
        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-gap: 5px; 
            background-color: #0055ff; 
            padding: 10px; 
            border-radius: 10px; 
            width: 320px; 
            max-width: 90vw; 
            border: 4px solid #0033aa;
        }
        
        /* Die weißen Löcher/Steine */
        .cell { 
            aspect-ratio: 1 / 1; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        /* Steinfarben */
        .cell.player { background-color: orange; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .cell.pimpinelly { background-color: yellow; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        
        button {
            padding: 12px 25px; font-size: 1.1rem; cursor: pointer;
            background-color: #333; color: white; border: none;
            border-radius: 8px; margin-top: 15px;
        }

        @keyframes circusLights {
            0%, 100% { box-shadow: 0 0 12px 4px red, 0 0 20px 6px yellow; }
            50% { box-shadow: 0 0 12px 4px yellow, 0 0 20px 6px red; }
        }
    </style>
</head>
<body>

    <h1>Pimpinellys 4-Gewinnt</h1>
    <p class="info">Du spielst gegen den listigen Pimpinelly!</p>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <h2 id="status">Du bist dran!</h2>
    <button onclick="resetGame()">Neu starten</button>

    <script>
        const ROWS = 6;
        const COLUMNS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
        let gameActive = true;

        // Erzeugt das Spielfeld
        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r; cell.dataset.col = c;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1);
                if (checkWin(r, c, 1)) {
                    document.getElementById('status').innerText = "Sieg! 🎉";
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Pimpinelly überlegt...";
                    setTimeout(pimpinellyMove, 600);
                }
            }
        }

        function pimpinellyMove() {
            if (!gameActive) return;
            let move = calculateBestMove();
            let r = getLowestEmptyRow(move);
            if (r !== -1) {
                placeStone(r, move, 2);
                if (checkWin(r, move, 2)) {
                    document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Du bist dran!";
                }
            }
        }

        // --- SCHLAUE KI LOGIK ---
        function calculateBestMove() {
            let bestScore = -Infinity;
            let bestMoves = [];

            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r === -1) continue;

                // 1. Pimpinelly Sieg-Check
                board[r][c] = 2;
                if (checkWin(r, c, 2)) { board[r][c] = 0; return c; }
                board[r][c] = 0;

                // 2. Block-Check (Verhindert Spieler-Sieg)
                board[r][c] = 1;
                if (checkWin(r, c, 1)) { board[r][c] = 0; return c; }
                board[r][c] = 0;

                // 3. Strategie
                let score = 0;
                const centerWeights = [0, 2, 5, 20, 5, 2, 0];
                score += centerWeights[c];

                // Bedrohungserkennung (extrem starker Block gegen Reihen am Boden)
                score += evaluateMovePotential(r, c, 1) * 35; 
                score += evaluateMovePotential(r, c, 2) * 15;

                // Anti-Vorlage (Setze nicht unter eine Gewinn-Möglichkeit)
                if (r > 0) {
                    board[r][c] = 2;
                    if (checkWin(r - 1, c, 1)) score -= 300;
                    board[r][c] = 0;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [c];
                } else if (score === bestScore) {
                    bestMoves.push(c);
                }
            }
            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        function evaluateMovePotential(r, c, p) {
            let totalPotential = 0;
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 0;
                for (let i = -3; i <= 3; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS) {
                        if (board[nr][nc] === p || (nr === r && nc === c)) count++;
                        else if (board[nr][nc] !== 0) count = 0; 
                    }
                    if (count >= 4) totalPotential++;
                }
            }
            return totalPotential;
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === 0) return r;
            }
            return -1;
        }

        function isDraw() { return board[0].every(cell => cell !== 0); }

        function placeStone(r, c, p) {
            board[r][c] = p;
            const cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
            cell.classList.add(p === 1 ? 'player' : 'pimpinelly');
        }

        function checkWin(r, c, p) {
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++; else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++; else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() {
            board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
            gameActive = true;
            document.getElementById('status').innerText = "Du bist dran!";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
