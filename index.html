<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        * { box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; padding: 0;
            background: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Verhindert Wackeln */
            touch-action: manipulation;
        }

        .logo-img { width: 60px; height: auto; margin-top: 5px; }
        h1 { color: #0044cc; margin: 2px 0; font-size: 1.4rem; }
        p { margin: 0 0 5px 0; font-size: 0.8rem; color: #666; }

        /* Das Gehäuse passt sich jetzt der Bildschirmbreite an */
        .wrapper {
            background: #222;
            padding: 8px;
            border-radius: 12px;
            border: 4px solid #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 95vw; /* Verhindert das Abschneiden links/rechts */
        }

        /* Nahtloses Spielfeld */
        .board { 
            background-color: #0044cc; 
            border-spacing: 0;
            border-collapse: collapse;
            margin: 0 auto;
        }

        /* Die Zellen skalieren jetzt mit der Bildschirmgröße */
        .cell {
            width: 13vw; 
            height: 13vw;
            max-width: 45px;
            max-height: 45px;
            background: #0044cc;
            padding: 3px;
        }

        .hole {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 1px 1px 4px rgba(0,0,0,0.2);
        }

        .p1 .hole { background: #ff9800 !important; } /* Spieler */
        .p2 .hole { background: #ffeb3b !important; } /* Pimpinelly */

        #status { font-weight: bold; margin: 8px 0; font-size: 1rem; height: 1.2em; }
        
        .reset-btn {
            background: #ff9800; color: #000; border: none; 
            padding: 10px 20px; font-size: 1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
        }

        .confetti {
            position: absolute; width: 6px; height: 6px; top: -10px;
            z-index: 100; pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly" class="logo-img">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <p>Du gegen Pimpinelly</p>

    <div class="wrapper">
        <table id="game-board" class="board"></table>
    </div>

    <div id="status">Du bist dran!</div>
    <button class="reset-btn" onclick="startNewGame()">Neues Spiel</button>

    <audio id="fanfare" src="tusch.mp3" preload="auto"></audio>

    <script>
        const ROWS = 6, COLS = 7;
        let grid = [], canMove = true;

        function startNewGame() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            canMove = true;
            document.getElementById('status').innerText = "Du bist dran!";
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            render();
        }

        function render() {
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    td.className = 'cell
