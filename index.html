<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinelly 4 Gewinnt</title>
  
<style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background-color: #fce4ec; 
            color: #333; 
            margin: 0; 
            padding: 10px; 
            /* Verhindert Zoomen beim Tippen */
            touch-action: manipulation; 
        }

        /* Das Logo passt sich an */
        img { 
            width: 100%;
            max-width: 150px; 
            height: auto; 
            margin: 10px auto; 
            display: block;
            border-radius: 10px; 
        }

        h1 { font-size: 1.4rem; margin: 5px 0; }

        #score-display {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .board { 
            display: inline-grid; /* Zentriert sich besser */
            grid-template-columns: repeat(7, 1fr); 
            grid-gap: 4px; 
            background-color: #007bff; 
            padding: 8px; 
            border-radius: 10px; 
            margin: 0 auto;
            /* Wichtig: Nutzt die Breite, aber bleibt im Rahmen */
            width: 95vw; 
            max-width: 380px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .cell { 
            /* Dies erzwingt, dass die Zelle immer quadratisch bleibt */
            width: 100%;
            aspect-ratio: 1 / 1; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 1px solid #0056b3;
            box-sizing: border-box;
        }

        .cell.player { background-color: orange; box-shadow: inset 0 0 6px rgba(0,0,0,0.3); }
        .cell.computer { background-color: blue; box-shadow: inset 0 0 6px rgba(0,0,0,0.3); }

        #status { font-size: 1.2rem; margin: 15px 0; min-height: 1.5em; }

        button { 
            padding: 15px 30px; 
            font-size: 1.1rem; 
            background-color: #ff4081; 
            color: white; 
            border: none; 
            border-radius: 50px; /* Schönere runde Buttons */
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
            width: 80%;
            max-width: 280px;
        }

        button:active { transform: scale(0.98); }
  </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly Logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    
    <div class="board" id="board"></div>
    
    <h2 id="status">Du bist dran (Orange)!</h2>
    <button onclick="resetGame()">Spiel neu starten</button>

    <script>
 const ROWS = 6;
        const COLUMNS = 7;
        let board = [];
        let gameActive = true;

        function initGame() {
            board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
            gameActive = true;
            document.getElementById('status').innerText = "Du bist dran (Orange)!";
            createBoard();
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1);
                if (checkWin(r, c)) {
                    document.getElementById('status').innerText = "Sieg für Pimpinelly! 🤡🎺";
                    try { new Audio('tusch.mp3').play(); } catch(e) {}
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Computer überlegt...";
                    setTimeout(makeMove, 500);
                }
            }
        }

        function makeMove() {
            if (!gameActive) return;
            let bestScore = -Infinity;
            let move = 3;

            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r !== -1) {
                    let score = evaluatePosition(r, c);
                    
                    // Simulation: Verhindere tödliche Vorlagen
                    board[r][c] = 2;
                    let nextR = getLowestEmptyRow(c);
                    if (nextR !== -1) {
                        board[nextR][c] = 1;
                        if (checkWin(nextR, c)) score -= 2000; // Drastisch erhöht!
                        board[nextR][c] = 0;
                    }
                    board[r][c] = 0;

                    if (score > bestScore) {
                        bestScore = score;
                        move = c;
                    } else if (score === bestScore) {
                        if (Math.random() > 0.5) move = c;
                    }
                }
            }

            let finalRow = getLowestEmptyRow(move);
            placeStone(finalRow, move, 2);
            if (checkWin(finalRow, move)) {
                document.getElementById('status').innerText = "Computer gewinnt! 🤖";
                gameActive = false;
            } else {
                document.getElementById('status').innerText = "Du bist dran (Orange)!";
            }
        }

        function evaluatePosition(r, c) {
            let score = 0;

            // 1. Sofortiger Sieg (KI)
            board[r][c] = 2;
            if (checkWin(r, c)) { board[r][c] = 0; return 100000; }
            
            // 2. Sofortiges Blocken (Spieler) - ÜBERLEBENSWICHTIG
            board[r][c] = 1;
            if (checkWin(r, c)) { board[r][c] = 0; return 50000; }
            board[r][c] = 0;

            // 3. Spezial-Scan für horizontale Reihen (Boden-Check)
            score += scanHorizontalDanger(r, c);

            // 4. Mitte-Bonus
            score += (3 - Math.abs(3 - c)) * 50;

            return score;
        }

        function scanHorizontalDanger(r, c) {
            let bonus = 0;
            // Teste, wie viele Steine des Spielers in dieser Reihe wären
            board[r][c] = 1;
            let count = 0;
            // Wir prüfen die direkte Umgebung links und rechts
            for (let dc = -3; dc <= 3; dc++) {
                let nc = c + dc;
                if (nc >= 0 && nc < COLUMNS && board[r][nc] === 1) {
                    count++;
                } else {
                    if (count > 0) {
                        if (count === 2) bonus += 100;
                        if (count === 3) bonus += 1000;
                        count = 0;
                    }
                }
            }
            board[r][c] = 0;
            return bonus;
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === 0) return r;
            }
            return -1;
        }

        function placeStone(r, c, p) {
            board[r][c] = p;
            const cell = document.getElementById(`cell-${r}-${c}`);
            cell.classList.add(p === 1 ? 'player' : 'computer');
        }

        function checkWin(r, c) {
            const p = board[r][c];
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() { initGame(); }
        initGame();
    </script>
</body>
</html>
