<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; 
            background: #ffffff; 
            margin: 0; padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo-img { width: 65px; height: auto; margin-bottom: 5px; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.5rem; text-align: center; }
        .sub { font-size: 1rem; color: #333; margin-bottom: 10px; font-weight: bold; }

        .wrapper {
            background: #222;
            padding: 8px;
            border-radius: 15px;
            border: 4px solid #444;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            max-width: 100%;
        }

        .board { 
            background-color: #0044cc; 
            border-collapse: collapse;
            border-spacing: 0;
            margin: 0 auto;
        }

        .cell {
            width: 42px;
            height: 42px;
            background: #0044cc;
            padding: 3px;
            cursor: pointer;
        }

        .hole {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 1px 1px 4px rgba(0,0,0,0.2);
        }

        .p1 .hole { background: #ff9800 !important; }
        .p2 .hole { background: #ffeb3b !important; }

        #status { font-weight: bold; margin: 15px 0; font-size: 1.1rem; height: 1.5em; text-align: center; }
        
        .reset-btn {
            background: #ff9800; color: #000; border: none; 
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .confetti {
            position: fixed; width: 8px; height: 8px; top: -10px;
            z-index: 999; pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        @media (max-width: 350px) {
            .cell { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly Logo" class="logo-img">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <div class="sub">Du spielst heute mit Pimpinelly</div>

    <div class="wrapper">
        <table id="game-board" class="board"></table>
    </div>

    <div id="status">Bist du bereit?</div>
    <button class="reset-btn" onclick="startNewGame()">Neues Spiel</button>

    <audio id="fanfare" src="tusch.mp3" preload="auto"></audio>

    <script>
        const ROWS = 6, COLS = 7;
        let grid = [], canMove = true;

        function startNewGame() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            canMove = true;
            document.getElementById('status').innerText = "Du bist am Zug!";
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            render();
        }

        function render() {
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    td.className = 'cell' + (grid[r][c] === 1 ? ' p1' : grid[r][c] === 2 ? ' p2' : '');
                    td.innerHTML = '<div class="hole"></div>';
                    td.onclick = () => makeMove(c);
                    tr.appendChild(td);
                }
                boardEl.appendChild(tr);
            }
        }

        function makeMove(c) {
            if (!canMove) return;
            let r = getR(c);
            if (r === -1) return;
            grid[r][c] = 1;
            render();
            if (check(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! 🎉";
                document.getElementById('fanfare').play().catch(() => {});
                launchConfetti();
                canMove = false;
