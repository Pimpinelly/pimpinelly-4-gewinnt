<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --board: #0044cc;
            --player: #ff9800;
            --pimpinelly: #ffeb3b;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); text-align: center; margin: 0; padding: 10px; }
        
        /* Das Clown-Logo dezent oben */
        .logo { width: 80px; height: auto; margin-top: 10px; opacity: 0.9; }

        h1 { margin: 5px 0; color: var(--board); font-size: 2rem; font-weight: 800; }
        .sub { font-style: italic; color: #666; margin-bottom: 15px; display: block; }

        /* Der Rahmen mit bunten blinkenden Lichtern */
        .lights-border {
            display: inline-block;
            padding: 12px;
            border-radius: 25px;
            background: #222;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: rainbowLights 1.5s linear infinite;
        }

        @keyframes rainbowLights {
            0% { box-shadow: 0 0 20px red; border: 3px solid #ff0000; }
            33% { box-shadow: 0 0 20px lime; border: 3px solid #00ff00; }
            66% { box-shadow: 0 0 20px cyan; border: 3px solid #0000ff; }
            100% { box-shadow: 0 0 20px red; border: 3px solid #ff0000; }
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(7, 45px); 
            grid-template-rows: repeat(6, 45px); 
            grid-gap: 8px; 
            background: var(--board); 
            padding: 12px; 
            border-radius: 12px;
        }

        .slot { 
            width: 45px; height: 45px; background: white; 
            border-radius: 50%; cursor: pointer;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s ease;
        }

        .slot.p1 { background: var(--player); box-shadow: inset 0 0 10px rgba(0,0,0,0.4); }
        .slot.p2 { background: var(--pimpinelly); box-shadow: inset 0 0 10px rgba(0,0,0,0.4); }

        #status { margin-top: 15px; font-size: 1.2rem; font-weight: bold; color: #333; min-height: 1.5em; }
        
        /* Button in Orange/Schwarz-Style */
        button {
            margin-top: 20px; padding: 12px 35px; font-size: 1.1rem;
            background: var(--player); color: #000; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:hover { background: #fb8c00; transform: scale(1.03); }

        @media (max-width: 400px) {
            .grid { grid-template-columns: repeat(7, 36px); grid-template-rows: repeat(6, 36px); grid-gap: 6px; }
            .slot { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>

        <div id="board" class="grid"></div>

    <div id="status">Du bist dran!</div>
    <button onclick="reset()">Neues Spiel</button>

    <audio id="winSound" src="tusch.mp3" preload="auto"></audio>
