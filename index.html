<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinelly 4 Gewinnt</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #fce4ec; color: #333; }
        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 50px); 
            grid-gap: 8px; 
            justify-content: center; 
            background-color: #007bff; 
            padding: 15px; 
            border-radius: 15px; 
            margin: 20px auto; 
            width: fit-content;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .cell { 
            width: 50px; 
            height: 50px; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid #0056b3;
        }
        .cell.player { background-color: orange; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .cell.computer { background-color: blue; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        img { width: 180px; margin-top: 20px; border-radius: 10px; }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #ff4081; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background-color: #f50057; }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly Logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    
    <div class="board" id="board"></div>
    
    <h2 id="status">Du bist dran (Orange)!</h2>
    <button onclick="resetGame()">Spiel neu starten</button>

    <script>
        const ROWS = 6;
        const COLUMNS = 7;
        let board = [];
        let gameActive = true;

        function initGame() {
            board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
            gameActive = true;
            document.getElementById('status').innerText = "Du bist dran (Orange)!";
            createBoard();
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1);
                if (checkWin(r, c)) {
                    document.getElementById('status').innerText = "Sieg für Pimpinelly! 🤡🎺";
                    try { new Audio('tusch.mp3').play(); } catch(e) {}
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Computer überlegt...";
                    setTimeout(makeMove, 600);
                }
            }
        }

        function makeMove() {
            if (!gameActive) return;
            let bestScore = -Infinity;
            let move = 0;

            // Alle Spalten prüfen
            for (let c = 0; c < COLUMNS; c++) {
                let r = getLowestEmptyRow(c);
                if (r !== -1) {
                    let score = evaluateMove(r, c);
                    
                    // VORAUSSCHAU: Verhindere, dass der Computer dir einen Sieg "auflegt"
                    board[r][c] = 2; 
                    let nextRow = getLowestEmptyRow(c);
                    if (nextRow !== -1) {
                        board[nextRow][c] = 1;
                        if (checkWin(nextRow, c)) {
                            score -= 500; // Riesige Strafe, wenn dieser Zug dir zum Sieg verhilft
                        }
                        board[nextRow][c] = 0;
                    }
                    board[r][c] = 0;

                    if (score > bestScore) {
                        bestScore = score;
                        move = c;
                    } else if (score === bestScore) {
                        if (Math.random() > 0.5) move = c;
                    }
                }
            }

            let finalRow = getLowestEmptyRow(move);
            placeStone(finalRow, move, 2);
            if (checkWin(finalRow, move)) {
                document.getElementById('status').innerText = "Computer gewinnt! 🤖";
                gameActive = false;
            } else {
                document.getElementById('status').innerText = "Du bist dran (Orange)!";
            }
        }

        function evaluateMove(r, c) {
            let score = 0;
            
            // 1. Kann der Computer JETZT gewinnen?
            board[r][c] = 2;
            if (checkWin(r, c)) {
                board[r][c] = 0;
                return 2000; // Sofort zuschlagen!
            }
            board[r][c] = 0;

            // 2. Muss der Computer dich JETZT blocken? (Egal wo auf dem Feld!)
            board[r][c] = 1;
            if (checkWin(r, c)) {
                board[r][c] = 0;
                return 1000; // Absolute Priorität: Blocken!
            }
            board[r][c] = 0;
            
            // 3. Strategische Punkte
            if (c === 3) score += 20; // Mitte ist Gold wert
            if (c === 2 || c === 4) score += 10; // Flanken der Mitte
            
            // Bonus für "fast fertige" Reihen (2 oder 3 Steine)
            // (Hier könnte man noch mehr Logik einbauen, aber Blocken ist erst mal wichtiger)

            return score;
        }

        function getLowestEmptyRow(c) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === 0) return r;
            }
            return -1;
        }

        function placeStone(r, c, p) {
            board[r][c] = p;
            const cell = document.getElementById(`cell-${r}-${c}`);
            cell.classList.add(p === 1 ? 'player' : 'computer');
        }

        function checkWin(r, c) {
            const p = board[r][c];
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLUMNS && board[nr][nc] === p) count++;
                    else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function resetGame() { initGame(); }

        initGame();
    </script>
</body>
</html>
