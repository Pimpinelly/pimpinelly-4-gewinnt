<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background-color: #f0f0f0; 
            margin: 0; padding: 10px;
            touch-action: manipulation;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #333; }
        p.info { font-style: italic; color: #555; margin-bottom: 10px; }

        .board-container {
            display: inline-block;
            padding: 12px;
            background-color: #222; 
            border-radius: 20px;
            margin: 5px auto;
            position: relative;
            animation: circusLights 0.8s linear infinite;
            max-width: 95vw;
        }

        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-gap: 5px; 
            background-color: #0055ff; 
            padding: 10px; 
            border-radius: 10px; 
            width: 350px; 
            max-width: 85vw; 
            border: 4px solid #0033aa;
        }
        
        .cell { 
            aspect-ratio: 1 / 1; 
            background-color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        .cell.player { background-color: orange; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .cell.pimpinelly { background-color: yellow; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        
        button {
            padding: 12px 25px; font-size: 1.1rem; cursor: pointer;
            background-color: #333; color: white; border: none;
            border-radius: 8px; margin-top: 15px;
        }

        @keyframes circusLights {
            0%, 100% { box-shadow: 0 0 12px 4px red, 0 0 20px 6px yellow; }
            50% { box-shadow: 0 0 12px 4px yellow, 0 0 20px 6px red; }
        }
    </style>
</head>
<body>

    <h1>Pimpinellys 4-Gewinnt</h1>
    <p class="info">Du spielst heute gegen den listigen Pimpinelly!</p>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <h2 id="status">Du bist dran!</h2>
    <button onclick="resetGame()">Neu starten</button>

    <script>
        const ROWS = 6;
        const COLUMNS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLUMNS).fill(0));
        let gameActive = true;

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLUMNS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r; cell.dataset.col = c;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(c) {
            if (!gameActive) return;
            let r = getLowestEmptyRow(c);
            if (r !== -1) {
                placeStone(r, c, 1);
                if (checkWin(r, c, 1)) {
                    document.getElementById('status').innerText = "Gratulation! Du hast gewonnen! 🎉";
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Pimpinelly überlegt...";
                    setTimeout(pimpinellyMove, 600);
                }
            }
        }

        function pimpinellyMove() {
            if (!gameActive) return;
            let move = calculateBestMove();
            let r = getLowestEmptyRow(move);
            if (r !== -1) {
                placeStone(r, move, 2);
                if (checkWin(r, move, 2)) {
                    document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
                    gameActive = false;
                } else if (isDraw()) {
                    document.getElementById('status').innerText = "Unentschieden! 🤡";
                    gameActive = false;
                } else {
                    document.getElementById('status').innerText = "Du bist dran!";
                }
            }
        }
