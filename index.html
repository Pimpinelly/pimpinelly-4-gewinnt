<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinelly - 4 Gewinnt</title>
    <style>
        :root {
            --pimpi-orange: #FF8C00;
            --pimpi-blue: #007BFF;
            --bg-color: #FFF5E6;
            --board-color: #333;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }

        #logo {
            width: 120px;
            margin: 10px 0;
        }

        h1 { 
            color: var(--pimpi-orange); 
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        #status {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #444;
            min-height: 1.5em;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-gap: 6px;
            background-color: var(--board-color);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            max-width: 95vw;
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* Responsive Größe für größere Handys */
        @media (min-width: 400px) {
            .cell { width: 48px; height: 48px; }
        }

        .cell.orange { background-color: var(--pimpi-orange); }
        .cell.blue { background-color: var(--pimpi-blue); }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: var(--pimpi-orange);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly" id="logo" onerror="this.style.display='none'">
    <h1>4 Gewinnt</h1>
    
    <div id="status">Du bist dran (Orange)</div>
    <div id="game-board"></div>
    
    <button onclick="resetGame()">Neues Spiel</button>

    <audio id="tuschSound" src="tusch.mp3" preload="auto"></audio>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = [];
        let gameOver = false;
        const boardElement = document.getElementById('game-board');
        const statusElement = document.getElementById('status');
        const tusch = document.getElementById('tuschSound');

        function initBoard() {
            boardElement.innerHTML = '';
            board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => playerMove(c);
                    boardElement.appendChild(cell);
                }
            }
        }

        function playerMove(col) {
            if (gameOver) return;
            if (makeMove(col, 'orange')) {
                if (checkWin('orange')) {
                    statusElement.innerText = "Gewonnen! Ein Hoch auf Pimpinelly!";
                    playSound();
                    gameOver = true;
                } else {
                    statusElement.innerText = "Handy überlegt...";
                    setTimeout(aiMove, 600);
                }
            }
        }

        function aiMove() {
            if (gameOver) return;
            let availableCols = [];
            for(let c=0; c<COLS; c++) if(board[0][c] === null) availableCols.push(c);
            
            if(availableCols.length > 0) {
                let col = availableCols[Math.floor(Math.random() * availableCols.length)];
                makeMove(col, 'blue');
                if (checkWin('blue')) {
                    statusElement.innerText = "Das Handy hat gewonnen!";
                    playSound();
                    gameOver = true;
                } else {
                    statusElement.innerText = "Du bist dran (Orange)";
                }
            }
        }

       function makeMove() {
    if (!gameActive) return;

    let bestScore = -Infinity;
    let move = -1;

    // Die KI prüft jede Spalte
    for (let c = 0; c < COLUMNS; c++) {
        let r = getLowestEmptyRow(c);
        if (r !== -1) {
            let score = 0;

            // 1. Sofortiger Sieg für KI? (Sehr wichtig)
            board[r][c] = 2;
            if (checkWin(r, c)) score += 1000;

            // 2. Muss KI den Spieler blocken? (Wichtig)
            board[r][c] = 1;
            if (checkWin(r, c)) score += 100;
            
            // 3. Strategie: Die Mitte ist meistens besser
            if (c === Math.floor(COLUMNS / 2)) score += 3;

            board[r][c] = 0; // Feld wieder frei machen

            // Den besten Zug merken
            if (score > bestScore) {
                bestScore = score;
                move = c;
            } else if (score === bestScore && Math.random() > 0.5) {
                move = c; // Bei Gleichstand zufällig wählen
            }
        }
    }

    // Falls kein strategischer Zug gefunden wurde, nimm eine freie Spalte
    if (move === -1 || bestScore === 0) {
        let available = [];
        for (let c = 0; c < COLUMNS; c++) {
            if (board[0][c] === 0) available.push(c);
        }
        move = available[Math.floor(Math.random() * available.length)];
    }

    let finalRow = getLowestEmptyRow(move);
    placeStone(finalRow, move, 2);
}

    // 2. Blocken: Muss der Computer den Spieler (Orange) stoppen?
    for (let c = 0; c < COLUMNS; c++) {
        let r = getLowestEmptyRow(c);
        if (r !== -1) {
            board[r][c] = 1; // Teste Zug für Orange
            if (checkWin(r, c)) {
                board[r][c] = 0; // Test beenden
                placeStone(r, c, 2); // Blau setzt genau dort
                return;
            }
            board[r][c] = 0; // Rückgängig
        }
    }

    // 3. Wenn nichts brennt: Zufälliger, aber gültiger Zug
    let availableColumns = [];
    for (let c = 0; c < COLUMNS; c++) {
        if (board[0][c] === 0) availableColumns.push(c);
    }
    
    if (availableColumns.length > 0) {
        let randomCol = availableColumns[Math.floor(Math.random() * availableColumns.length)];
        let row = getLowestEmptyRow(randomCol);
        placeStone(row, randomCol, 2);
    }
}
        function playSound() {
            tusch.currentTime = 0;
            tusch.play().catch(e => console.log("Audio-Hinweis: Interaktion nötig für Sound."));
        }

        function checkWin(player) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (checkDirection(r, c, 0, 1, player) || 
                        checkDirection(r, c, 1, 0, player) || 
                        checkDirection(r, c, 1, 1, player) || 
                        checkDirection(r, c, 1, -1, player)) return true;
                }
            }
            return false;
        }

        function checkDirection(r, c, dr, dc, p) {
            let count = 0;
            for (let i = 0; i < 4; i++) {
                let nr = r + i * dr;
                let nc = c + i * dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) count++;
                else break;
            }
            return count === 4;
        }

        function resetGame() {
            gameOver = false;
            statusElement.innerText = "Du bist dran (Orange)";
            initBoard();
        }

        initBoard();
    </script>
</body>
</html>
