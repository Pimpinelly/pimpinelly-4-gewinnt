<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinelly 4-Gewinnt</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #ffffff; 
            margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .logo { width: 60px; height: auto; margin-top: 5px; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.4rem; }
        .sub { font-size: 1.1rem; color: #333; margin-bottom: 15px; font-weight: bold; }

        /* Das Gehäuse */
        .game-area {
            background-color: #222;
            padding: 10px;
            border-radius: 12px;
            border: 4px solid #444;
            display: inline-block;
        }

        /* Das blaue Feld */
        .board { 
            background-color: #0044cc; 
            border-collapse: separate; 
            border-spacing: 5px; 
            border-radius: 8px;
        }

        /* Die weißen Löcher */
        .cell {
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 1px 1px 4px rgba(0,0,0,0.2);
        }

        /* Spielsteine */
        .p1 { background-color: #ff9800 !important; } /* Orange */
        .p2 { background-color: #ffeb3b !important; } /* Gelb */

        #status { font-weight: bold; margin: 15px 0; font-size: 1.1rem; min-height: 1.5em; }
        
        .reset-btn {
            background: #ff9800; color: #000; border: none; 
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
        }

        .confetti {
            position: fixed; width: 8px; height: 8px; top: -10px;
            z-index: 999; pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <div class="sub">Du spielst heute mit Pimpinelly</div>

    <div class="game-area">
        <table id="board" class="board"></table>
    </div>

    <div id="status">Bist du bereit?</div>
    <button class="reset-btn" onclick="resetGame()">Neues Spiel</button>

    <audio id="tusch" src="tusch.mp3" preload="auto"></audio>

    <script>
        const R = 6, C = 7;
        let grid = [], active = true;

        function resetGame() {
            grid = Array.from({length: R}, () => Array(C).fill(0));
            active = true;
            document.getElementById('status').innerText = "Du bist am Zug!";
            document.querySelectorAll('.confetti').forEach(n => n.remove());
            buildBoard();
        }

        function buildBoard() {
            const table = document.getElementById('board');
            table.innerHTML = '';
            for (let r = 0; r < R; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < C; c++) {
                    const td = document.createElement('td');
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (grid[r][c] === 1) div.classList.add('p1');
                    if (grid[r][c] === 2) div.classList.add('p2');
                    div.onclick = () => play(c);
                    td.appendChild(div);
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
        }

        function play(c) {
            if (!active) return;
            let r = getR(c);
            if (r === -1) return;

            grid[r][c] = 1;
            buildBoard();

            if (check(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! 🎉";
                document.getElementById('tusch').play().catch(() => {});
                rain();
                active = false;
            } else {
                active = false;
                document.getElementById('status').innerText = "Pimpinelly spielt mit...";
                setTimeout(cpu, 600);
            }
        }

        function cpu() {
            let move = -1;
            // 1. Pimpinelly gewinnt sofort
            for(let c=0; c<C; c++) {
                let r = getR(c);
                if(r!=-1) { grid[r][c]=2; if(check(r,c,2)) move=c; grid[r][c]=0; if(move!=-1) break; }
            }
            // 2. Deine 3er Reihen blocken
            if(move == -1) {
                for(let c=0; c<C; c++) {
                    let r = getR(c);
                    if(r!=-1) { grid[r][c]=1; if(check(r,c,1)) move=c; grid[r][c]=0; if(move!=-1) break; }
                }
            }
            // 3. Boden-Prävention (bei 2 Steinen)
            if(move == -1) {
                for(let c=0; c<C; c++) {
