<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinelly 4-Gewinnt</title>
    <style>
        body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 10px; text-align: center; overflow-x: hidden; }
        .logo { width: 60px; height: auto; margin-top: 10px; }
        h1 { color: #0044cc; margin: 5px 0; font-size: 1.4rem; }
        .sub { font-size: 1.1rem; color: #333; margin-bottom: 15px; font-weight: bold; display: block; }

        .wrapper {
            background-color: #222;
            padding: 10px;
            border-radius: 12px;
            border: 4px solid #444;
            width: 310px; 
            height: 275px;
            margin: 0 auto;
            display: block;
        }

        .board { 
            background-color: #0044cc; 
            width: 308px;
            height: 265px;
            border-spacing: 4px;
            border-radius: 8px;
        }

        .cell { 
            width: 38px; 
            height: 38px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            cursor: pointer;
            display: block;
        }

        .p1 { background-color: #ff9800 !important; } /* Spieler */
        .p2 { background-color: #ffeb3b !important; } /* Pimpinelly */

        #status { font-weight: bold; margin: 15px 0; font-size: 1.1rem; min-height: 1.5em; color: #333; }
        .reset-btn { background: #ff9800; color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; }
        
        .confetti { position: fixed; width: 8px; height: 8px; top: -10px; z-index: 999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <span class="sub">Du spielst heute mit Pimpinelly</span>

    <div class="wrapper">
        <table class="board">
            <tbody id="board-body">

                    for(let r=0; r<6; r++) {
                        document.write('<tr>');
                        for(let c=0; c<7; c++) {
                            document.write('<td><div id="c' + r + '-' + c + '" class="cell" onclick="play(' + c + ')">
