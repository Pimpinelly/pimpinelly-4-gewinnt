<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pimpinelly 4-Gewinnt</title>
    <style>
        body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 0; text-align: center; }
        .logo { width: 50px; height: auto; margin-top: 5px; }
        h1 { font-size: 1.1rem; margin: 5px 0; color: #0044cc; }
        .sub { font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; display: block; }

        /* Das Spielfeld-Gehäuse */
        .wrapper {
            background-color: #222;
            padding: 5px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 auto;
        }

        .board { 
            background-color: #0044cc; 
            border-spacing: 3px; 
            border-radius: 5px;
        }

        /* Kleine Zellen für maximale Kompatibilität */
        .cell { 
            width: 32px; 
            height: 32px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            display: block;
        }

        .p1 { background-color: #ff9800 !important; }
        .p2 { background-color: #ffeb3b !important; }

        #status { font-weight: bold; margin: 10px 0; font-size: 1rem; color: #333; height: 1.2em; }
        .reset-btn { 
            background: #ff9800; border: none; padding: 10px 20px; 
            font-weight: bold; border-radius: 20px; cursor: pointer;
        }

        .confetti { position: fixed; width: 6px; height: 6px; top: -10px; z-index: 999; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh); } }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="logo">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <span class="sub">Du spielst heute mit Pimpinelly</span>

    <div class="wrapper">
        <table class="board">
            <tr>
                <td><div id="c0-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c0-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c0-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c0-3" class="cell" onclick="play(3)"></div></td>
                <td><div id="c0-4" class="cell" onclick="play(4)"></div></td>
                <td><div id="c0-5" class="cell" onclick="play(5)"></div></td>
                <td><div id="c0-6" class="cell" onclick="play(6)"></div></td>
            </tr>
            <tr>
                <td><div id="c1-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c1-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c1-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c1-3" class="cell" onclick="play(3)"></div></td>
                <td><div id="c1-4" class="cell" onclick="play(4)"></div></td>
                <td><div id="c1-5" class="cell" onclick="play(5)"></div></td>
                <td><div id="c1-6" class="cell" onclick="play(6)"></div></td>
            </tr>
            <tr>
                <td><div id="c2-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c2-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c2-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c2-3" class="cell" onclick="play(3)"></div></td>
                <td><div id="c2-4" class="cell" onclick="play(4)"></div></td>
                <td><div id="c2-5" class="cell" onclick="play(5)"></div></td>
                <td><div id="c2-6" class="cell" onclick="play(6)"></div></td>
            </tr>
            <tr>
                <td><div id="c3-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c3-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c3-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c3-3" class="cell" onclick="play(3)"></div></td>

                <td><div id="c3-6" class="cell" onclick="play(6)"></div></td>
            </tr>
            <tr>
                <td><div id="c4-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c4-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c4-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c4-3" class="cell" onclick="play(3)"></div></td>
                <td><div id="c4-4" class="cell" onclick="play(4)"></div></td>
                <td><div id="c4-5" class="cell" onclick="play(5)"></div></td>

            </tr>
            <tr>
                <td><div id="c5-0" class="cell" onclick="play(0)"></div></td>
                <td><div id="c5-1" class="cell" onclick="play(1)"></div></td>
                <td><div id="c5-2" class="cell" onclick="play(2)"></div></td>
                <td><div id="c5-3" class="cell" onclick="play(3)"></div></td>
                <td><div id="c5-4" class="cell" onclick="play(4)"></div></td>
                <td><div id="c5-5" class="cell" onclick="play(5)"></div></td>
                <td><div id="c5-6" class="cell" onclick="play(6)"></div></td>
            </tr>
        </table>
    </div>

    <div id="status">Laden...</div>
    <button class="reset-btn" onclick="resetGame()">Neues Spiel</button>

    <audio id="tusch" src="tusch.mp3" preload="auto"></audio>

    <script>
        const R = 6, C = 7;
        let grid = [];
        let active = false;

        function resetGame() {
            grid = Array.from({ length: R }, () => new Array(C).fill(0));
            active = true;
            document.getElementById('status').innerText = "Du bist am Zug!";
            document.querySelectorAll('.confetti').forEach(n => n.remove());
            updateVisuals();
        }

        function updateVisuals() {
            for(let r=0; r<R; r++) {
                for(let c=0; c<C; c++) {
                    let cell = document.getElementById('c' + r + '-' + c);
                    cell.className = 'cell';
                    if(grid[r][c] === 1) cell.classList.add('p1');
                    if(grid[r][c] === 2) cell.classList.add('p2');
                }
            }
        }

        function play(c) {
            if (!active) return;
            let r = getR(c);
            if (r === -1) return;
            grid[r][c] = 1;
            updateVisuals();
            if (check(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! 🎉";
                document.getElementById('tusch').play().catch(() => {});
                active = false;
            } else {
                active = false;
                document.getElementById('status').innerText = "Pimpinelly denkt...";
                setTimeout(cpu, 500);
            }
        }

        function cpu() {
            let move = -1;
            // 1. Pimpinelly gewinnt
            for(let c=0; c<C; c++) {
                let r = getR(c);
                if(r!=-1) { grid[r][c]=2; if(check(r,c,2)) move=c; grid[r][c]=0; if(move!=-1) break; }
            }
            // 2. Blocken (Sieg verhindern)
            if(move == -1) {
                for(let c=0; c<C; c++) {
                    let r = getR(c);
                    if(r!=-1) { grid[r][c]=1; if(check(r,c,1)) move=c; grid[r][c]=0; if(move!=-1) break; }
                }
            }
            // 3. NEU: Radikale Boden-Prävention (Alle Nachbarn blocken)
            if(move == -1) {
