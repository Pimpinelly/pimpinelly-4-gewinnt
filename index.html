<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimpinellys 4-Gewinnt</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; text-align: center; padding: 10px; margin: 0; overflow-x: hidden; }
        .logo-img { width: 80px; height: auto; display: block; margin: 0 auto; }
        h1 { color: #0044cc; margin: 10px 0; }
        
        .wrapper {
            display: inline-block;
            background: #222;
            padding: 10px;
            border-radius: 15px;
            border: 5px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .board { background-color: #0044cc; padding: 10px; border-radius: 8px; display: table; margin: 0 auto; }
        .row { display: table-row; }
        
        .cell {
            display: table-cell;
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            border: 4px solid #0044cc;
            cursor: pointer;
        }

        .p1 { background: #ff9800 !important; }
        .p2 { background: #ffeb3b !important; }

        #status { font-weight: bold; margin: 15px 0; font-size: 1.2rem; min-height: 1.5em; }
        
        .reset-btn {
            background: #ff9800;
            color: #000000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        /* Konfetti Styling */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            top: -10px;
            z-index: 1000;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Pimpinelly" class="logo-img">
    <h1>Pimpinellys 4-Gewinnt</h1>
    <p>Du spielst heute gegen Pimpinelly</p>

    <div class="wrapper">
        <div id="game-board" class="board"></div>
    </div>

    <div id="status">Lade Spiel...</div>
    <button class="reset-btn" onclick="startNewGame()">Neues Spiel</button>

    <audio id="fanfare" src="tusch.mp3"></audio>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let grid = [];
        let canMove = true;

        function startNewGame() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            canMove = true;
            document.getElementById('status').innerText = "Du bist dran!";
            // Altes Konfetti entfernen
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            render();
        }

        function render() {
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                for (let c = 0; c < COLS; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    if (grid[r][c] === 1) cellDiv.classList.add('p1');
                    if (grid[r][c] === 2) cellDiv.classList.add('p2');
                    cellDiv.onclick = () => makeMove(c);
                    rowDiv.appendChild(cellDiv);
                }
                boardEl.appendChild(rowDiv);
            }
        }

        function makeMove(c) {
            if (!canMove) return;
            let r = getR(c);
            if (r === -1) return;

            grid[r][c] = 1;
            render();

            if (check(r, c, 1)) {
                document.getElementById('status').innerText = "Sieg! 🎉";
                document.getElementById('fanfare').play().catch(() => {});
                createConfetti(); // Hier startet der Regen
                canMove = false;
            } else {
                canMove = false;
                document.getElementById('status').innerText = "Pimpinelly zieht...";
                setTimeout(ai, 500);
            }
        }

        function createConfetti() {
            const colors = ['#ff9800', '#ffeb3b', '#0044cc', '#ff0000', '#00ff00', '#ff00ff'];
            for (let i = 0; i < 100; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.opacity = Math.random();
                document.body.appendChild(c);
            }
        }

        function ai() {
            let move = -1;
            // Pimpinelly Logik
            for(let c=0; c<COLS; c++) {
                let r = getR(c);
                if(r != -1) { grid[r][c]=2; if(check(r,c,2)) move=c; grid[r][c]=0; }
            }
            if(move == -1) {
                for(let c=0; c<COLS; c++) {
                    let r = getR(c);
                    if(r != -1) { grid[r][c]=1; if(check(r,c,1)) move=c; grid[r][c]=0; }
                }
            }
            if(move == -1) move = 3;
            if(getR(move) == -1) {
                for(let i=0; i<COLS; i++) if(getR(i)!=-1) move=i;
            }

            let finalR = getR(move);
            grid[finalR][move] = 2;
            render();

            if (check(finalR, move, 2)) {
                document.getElementById('status').innerText = "Pimpinelly gewinnt! 🤡";
            } else {
                canMove = true;
                document.getElementById('status').innerText = "Du bist dran!";
            }
        }

        function getR(c) {
            for(let i=ROWS-1; i>=0; i--) if(grid[i][c]===0) return i;
            return -1;
        }

        function check(r, c, p) {
            const directions = [[0,1],[1,0],[1,1],[1,-1]];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) count++; else break;
                }
                for (let i = 1; i < 4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) count++; else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }

        startNewGame();
    </script>
</body>
</html>
